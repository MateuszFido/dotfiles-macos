###############################################################################
# Behaviour
###############################################################################

# Set default shell
set-option -g default-shell $SHELL
# set -g default-command "reattach-to-user-namespace -l zsh"

# Otherwise nvim colours are messed up
# set -g default-terminal "${TERM}"
set -g default-terminal "tmux-256color"

# Enable copying to clipboard with mouse
set -s set-clipboard off
set-option -s set-clipboard off
# bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# Enable mouse controls
set -g mouse on

# Display the status/window bar at the top like terminal tabs 
set -g status on 
set -g status-position top

# macOS mouse scrolling 
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# To copy, left click and drag to highlight text in yellow, 
# once you release left click yellow text will disappear and will automatically be available in clibboard
# # Use vim keybindings in copy mode
setw -g mode-keys vi
# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
setw -g mode-keys vi

setw -g xterm-keys on

# faster command sequences
set -s escape-time 10

# increase repeat timeout
set -sg repeat-time 600
set -s focus-events on

setw -q -g utf8 on

# # Increase default pane buffer size
set-option -g history-limit 10000

# start windows numbering at 1
set -g base-index 1

# make pane numbering consistent with windows
setw -g pane-base-index 1

# rename window after the pane's curr folder 
setw -g automatic-rename on
setw -g automatic-rename-format '#{pane_current_command}'

# prevent zsh and other programs from overriding the window name 
set -g allow-rename off

# renumber windows when a window is closed
set -g renumber-windows on

# set terminal title
set -g set-titles on

# slightly longer pane indicators display time
set -g display-panes-time 800

# slightly longer status messages display time
set -g display-time 1000

# redraw status line every 10 seconds
set -g status-interval 10

# activity - set quite mode
set -g monitor-activity on
setw -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none

set-option -sa terminal-features ',xterm-ghostty:RGB'
